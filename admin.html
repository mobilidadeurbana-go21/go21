<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobi — Administração</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<style>
:root{
  --bg:#f5f6f8;--card:#ffffff;--txt:#14161a;--sub:#5d6470;--linha:#e3e6eb;--pri:#0b6bcb;--pri-txt:#ffffff;
  --ok:#14804a;--ok-bg:#e6f4ec;--alerta:#a15c00;--alerta-bg:#fff3e0;--perigo:#c62828;--perigo-bg:#fdecec;
  --alta:#c62828;--moderada:#e07b00;--normal:#1f7a3a;--baixa:#7a8594;
  --raio:14px;--ok-txt:#ffffff;--perigo-txt:#ffffff;--sombra:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.05);
  --fonte:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--card:#181b21;--txt:#eef0f3;--sub:#a3aab5;--linha:#2a2f37;--pri:#4ea1ff;--pri-txt:#0b0d10;
  --ok:#4cc38a;--ok-bg:#12291d;--alerta:#ffb547;--alerta-bg:#2c2312;--perigo:#ff6b6b;--perigo-bg:#2e1616;--sombra:none;--ok-txt:#0b0d10;--perigo-txt:#0b0d10}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b21;--txt:#eef0f3;--sub:#a3aab5;--linha:#2a2f37;--pri:#4ea1ff;--pri-txt:#0b0d10;
  --ok:#4cc38a;--ok-bg:#12291d;--alerta:#ffb547;--alerta-bg:#2c2312;--perigo:#ff6b6b;--perigo-bg:#2e1616;--sombra:none;--ok-txt:#0b0d10;--perigo-txt:#0b0d10}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:var(--fonte);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden}
a{color:var(--pri)}
h1{font-size:1.35rem;margin:.2rem 0 .8rem}h2{font-size:1.1rem;margin:1.2rem 0 .6rem}h3{font-size:1rem;margin:.8rem 0 .4rem}
.app{max-width:560px;margin:0 auto;padding:12px 16px 96px}
.app.largo{max-width:1280px}
.topo{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--linha)}
.topo .marca{font-weight:800;letter-spacing:.2px}
.topo .esp{flex:1}
.card{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:14px;margin:10px 0;box-shadow:var(--sombra)}
.linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linha>.cresce{flex:1;min-width:0}
.grade{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:12px}
.kpi .v{font-size:1.35rem;font-weight:750}.kpi .r{font-size:.8rem;color:var(--sub)}
.sub{color:var(--sub);font-size:.88rem}
.peq{font-size:.8rem}
.cent{text-align:center}
.oculto{display:none!important}
label{display:block;font-size:.85rem;color:var(--sub);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--linha);border-radius:10px;padding:11px 12px;min-height:44px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:1px}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
.chk{display:flex;gap:8px;align-items:flex-start;margin:8px 0;color:var(--txt);font-size:.9rem}
button,.btn{font:inherit;font-weight:650;border:0;border-radius:12px;padding:12px 16px;min-height:46px;cursor:pointer;background:var(--pri);color:var(--pri-txt);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button.sec,.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--linha)}
button.perigo,.btn.perigo{background:var(--perigo);color:var(--perigo-txt)}
button.ok,.btn.ok{background:var(--ok);color:var(--ok-txt)}
button.mini{min-height:34px;padding:6px 10px;font-size:.85rem;border-radius:9px}
button:disabled{opacity:.55;cursor:not-allowed}
button.cheio{width:100%}
.pilula{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--linha);color:var(--txt)}
.pilula.ALTA,.pilula.CRITICA,.pilula.ALTO,.pilula.FALHOU,.pilula.BLOQUEADO,.pilula.VENCIDA{background:var(--perigo-bg);color:var(--perigo)}
.pilula.MODERADA,.pilula.MEDIO,.pilula.PENDENTE,.pilula.ALERTA,.pilula.EM_ANALISE,.pilula.EM_ATENDIMENTO{background:var(--alerta-bg);color:var(--alerta)}
.pilula.NORMAL,.pilula.OK,.pilula.BAIXO,.pilula.PAGA,.pilula.CONFIRMADO,.pilula.ATIVO,.pilula.ATIVA,.pilula.APROVADO{background:var(--ok-bg);color:var(--ok)}
.pilula.BAIXA{background:var(--linha);color:var(--sub)}
.aviso{background:var(--alerta-bg);color:var(--alerta);border-radius:10px;padding:10px 12px;font-size:.88rem;margin:8px 0}
.info{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:10px 12px;font-size:.88rem;margin:8px 0}
.erro{background:var(--perigo-bg);color:var(--perigo);border-radius:10px;padding:10px 12px;font-size:.88rem;margin:8px 0}
.abas{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--linha);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.abas a{flex:1;text-align:center;font-size:.72rem;color:var(--sub);text-decoration:none;padding:6px 2px;border-radius:10px}
.abas a .ic{display:block;font-size:1.25rem;line-height:1.2}
.abas a.ativa{color:var(--pri);font-weight:700}
.lista{list-style:none;margin:0;padding:0}
.lista li{padding:12px 0;border-bottom:1px solid var(--linha)}
.lista li:last-child{border-bottom:0}
.mapa{height:46vh;min-height:260px;border-radius:var(--raio);overflow:hidden;border:1px solid var(--linha);background:var(--linha)}
.mapa.baixo{height:34vh}
.opcao{border:2px solid var(--linha);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;display:flex;gap:10px;align-items:center;background:var(--card)}
.opcao.sel{border-color:var(--pri)}
.preco{font-weight:800;font-size:1.1rem}
.pin{font-size:2.2rem;letter-spacing:.35rem;font-weight:800;text-align:center;padding:6px 0}
.estrelas button{background:transparent;color:var(--sub);font-size:2rem;padding:0 4px;min-height:0}
.estrelas button.on{color:#f5a623}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);max-width:92vw;z-index:100;background:#222;color:#fff;padding:12px 16px;border-radius:12px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:.96}
#toast.erro{background:var(--perigo)}
.modal-fundo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);color:var(--txt);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal-fundo{align-items:center}.modal{border-radius:18px}}
.carregando{display:inline-block;width:18px;height:18px;border:2px solid var(--linha);border-top-color:var(--pri);border-radius:50%;animation:gira .8s linear infinite;vertical-align:middle}
@keyframes gira{to{transform:rotate(360deg)}}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--linha);vertical-align:top}
th{color:var(--sub);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.3px}
.rolar{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chat{display:flex;flex-direction:column;gap:8px}
.bolha{max-width:85%;padding:10px 12px;border-radius:14px;font-size:.93rem;white-space:pre-wrap}
.bolha.eu{align-self:flex-end;background:var(--pri);color:var(--pri-txt);border-bottom-right-radius:4px}
.bolha.ia{align-self:flex-start;background:var(--card);border:1px solid var(--linha);border-bottom-left-radius:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{min-height:34px;padding:6px 10px;font-size:.82rem;background:var(--card);color:var(--txt);border:1px solid var(--linha);font-weight:500}
.barra{height:8px;border-radius:99px;background:var(--linha);overflow:hidden}
.barra>i{display:block;height:100%;background:var(--pri)}
svg.grafico{width:100%;height:auto;display:block}
svg.grafico text{fill:var(--sub);font-size:10px}
.lado{display:grid;grid-template-columns:220px 1fr;gap:0;min-height:100vh}
.menu{background:var(--card);border-right:1px solid var(--linha);padding:12px 8px;position:sticky;top:0;height:100vh;overflow:auto}
.menu a{display:block;padding:9px 12px;border-radius:9px;color:var(--txt);text-decoration:none;font-size:.92rem}
.menu a.ativa{background:var(--pri);color:var(--pri-txt)}
.menu .grupo{font-size:.7rem;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin:12px 12px 4px}
@media (max-width:860px){.lado{grid-template-columns:1fr}.menu{position:static;height:auto;display:flex;overflow-x:auto;gap:4px;border-right:0;border-bottom:1px solid var(--linha)}.menu a{white-space:nowrap}.menu .grupo{display:none}}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app.largo{padding:16px 20px 60px}
.filtros{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.mapa.grande{height:62vh}
.calor td{text-align:center;font-weight:600}
.timeline{list-style:none;padding:0;margin:0;border-left:2px solid var(--linha)}
.timeline li{padding:6px 0 6px 12px;position:relative}
.timeline li::before{content:"";position:absolute;left:-6px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--pri)}
pre{white-space:pre-wrap;font-size:.8rem;background:var(--bg);padding:8px;border-radius:8px;max-height:260px;overflow:auto}
</style>
</head>
<body>
<div id="raiz"></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<script>window.MOBI_CONFIG = {};</script>
<script>
const CONFIG = { MARCA: 'Mobi Admin', SUPABASE_URL: '', SUPABASE_ANON_KEY: '', ASSISTENTE_URL: '', MAPA_TILES: '', MAPA_ATRIBUICAO: '' };
</script>
<script>
// ===================== NÚCLEO COMUM DOS APPS (gerado a partir de apps/src/core.js) =====================
// Regras: o app NUNCA grava tabela direto. Tudo passa pelas funções do banco (RPC), que validam
// permissão, saldo, limites e auditoria. O app só mostra e chama.
// ordem: CONFIG da página ← configuração gerada no build (window.MOBI_CONFIG) ← tela de configuração (só preenche o que faltar)
const CFG = (() => {
  let salvo = {};
  try { salvo = JSON.parse(localStorage.getItem('mobi_config') || '{}'); } catch (e) {}
  const base = Object.assign({}, CONFIG, Object.fromEntries(Object.entries(window.MOBI_CONFIG || {}).filter(([, v]) => v !== '' && v !== null)));
  return Object.assign(base, Object.fromEntries(Object.entries(salvo).filter(([k, v]) => v && !base[k])));
})();
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
// escapa TUDO que vem do banco ou do usuário antes de ir para o HTML (contra XSS)
const esc = (v) => String(v ?? '').replace(/[&<>"'`]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' }[c]));
const reais = (v) => v === null || v === undefined || v === '' ? '—' : Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num = (v, c = 0) => v === null || v === undefined ? '—' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: c, maximumFractionDigits: c });
const dataHora = (v) => v ? new Date(v).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
const dataCurta = (v) => v ? new Date(v).toLocaleDateString('pt-BR') : '—';
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'x' + Date.now() + Math.random().toString(16).slice(2));
const dorme = (ms) => new Promise((r) => setTimeout(r, ms));
const hojeISO = () => new Date().toISOString().slice(0, 10);

const ERROS = {
  CPF_INVALIDO: 'CPF inválido.', DADOS_JA_CADASTRADOS: 'Esses dados já estão em uso em outra conta.', LIMITE_EXCEDIDO: 'Muitas tentativas. Aguarde alguns minutos.',
  JA_EXISTE_CORRIDA_ATIVA: 'Você já tem uma corrida em andamento.', PAGAMENTO_EM_ABERTO: 'Há um pagamento pendente. Pague antes de pedir outra corrida.',
  FORA_DA_AREA_DE_ATENDIMENTO: 'Esse endereço está fora da área atendida.', CIDADE_NAO_ATENDIDA: 'Cidade ainda não atendida.',
  CATEGORIA_INDISPONIVEL: 'Categoria indisponível nesta cidade.', DESTINO_MUITO_PROXIMO: 'Destino muito próximo da origem.',
  SALDO_INSUFICIENTE: 'Saldo insuficiente.', SEM_PERMISSAO: 'Você não tem permissão para isso.', CONFLITO_DE_INTERESSE: 'Você não pode agir sobre o seu próprio cadastro.',
  CORRIDA_NAO_ENCONTRADA: 'Corrida não encontrada.', STATUS_INVALIDO: 'Essa ação não vale no estado atual da corrida.',
  CATEGORIA_SO_DE_OU_PARA_AEROPORTO: 'Essa categoria só vale de ou para o aeroporto.', CATEGORIA_SO_DE_OU_PARA_TERMINAL: 'Essa categoria só vale de ou para o terminal.',
  CATEGORIA_SO_SAINDO_DE_EVENTO: 'Essa categoria só vale saindo de um evento cadastrado.', DESTINO_DENTRO_DO_MUNICIPIO: 'Para destino na mesma cidade, escolha outra categoria.',
  ANTECEDENCIA_MINIMA: 'Agende com mais antecedência.', ANTECEDENCIA_MAXIMA: 'Data muito distante.', LIMITE_DE_AGENDAMENTOS: 'Você atingiu o limite de agendamentos ativos.',
  CUPOM_INVALIDO: 'Cupom inválido.', CUPOM_EXPIRADO: 'Cupom expirado.', CUPOM_ESGOTADO: 'Cupom esgotado.', CUPOM_JA_USADO: 'Você já usou esse cupom.',
  CUPOM_SO_PRIMEIRA_CORRIDA: 'Cupom válido só na primeira corrida.', CUPOM_NAO_VALE_NESTA_CATEGORIA: 'Cupom não vale para essa categoria.', CUPOM_NAO_VALE_NESTA_CIDADE: 'Cupom não vale nesta cidade.',
  PENDENCIAS_DE_COMPLIANCE: 'Há pendências no seu cadastro.', OFERTA_EXPIRADA: 'A oferta expirou.', OFERTA_INDISPONIVEL: 'Oferta indisponível.',
  LONGE_DO_EMBARQUE: 'Você ainda está longe do ponto de embarque.', GPS_DESATUALIZADO: 'Seu GPS está sem atualização. Verifique a localização.',
  VALOR_ABAIXO_DO_MINIMO: 'Valor abaixo do mínimo para saque.', JA_ASSINANTE: 'Você já é assinante.', CNPJ_INVALIDO: 'CNPJ inválido.',
  SEM_PERMISSAO_NA_EMPRESA: 'Sem permissão nesta empresa.', CATEGORIA_FORA_DA_POLITICA: 'Categoria fora da política da empresa.',
  JUSTIFICATIVA_OBRIGATORIA: 'Informe a justificativa.', LIMITE_MENSAL_ATINGIDO: 'Limite mensal atingido.', LIMITE_DE_CREDITO_DA_EMPRESA: 'Limite de crédito da empresa atingido.',
  EMPRESA_COM_FATURA_VENCIDA: 'A empresa tem fatura vencida.', CONTEXTO_INSUFICIENTE: 'Para bloquear, confirme um sinal ou detalhe a evidência.',
  ASSUMA_O_INCIDENTE_ANTES: 'Assuma o incidente antes de agir.', NOTIFICACAO_ESSENCIAL: 'Esse aviso é essencial e não pode ser desligado.',
  CORRIDA_EM_ANDAMENTO: 'Termine a corrida em andamento antes.', SAQUE_SEU_SALDO_ANTES: 'Saque seu saldo antes de excluir a conta.',
  CADASTRO_INCOMPLETO: 'Complete seu cadastro.', 'JWT expired': 'Sua sessão expirou. Entre de novo.',
};
function mensagemErro(e) {
  const cod = (e && (e.message || e.code)) || String(e);
  if (ERROS[cod]) return ERROS[cod] + (e.details && !/^[A-Z_]+$/.test(e.details) ? ' (' + e.details + ')' : '');
  if (/^[A-Z0-9_]+$/.test(cod)) { const t = cod.toLowerCase().replace(/_/g, ' '); return t.charAt(0).toUpperCase() + t.slice(1) + '.'; }
  if (/Failed to fetch|NetworkError/i.test(cod)) return 'Sem conexão. Verifique a internet.';
  return cod;
}

let sb = null;
function iniciarSupabase() {
  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY) return false;
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'mobi-auth' } });
  sb.auth.onAuthStateChange((evento) => {
    if (evento === 'PASSWORD_RECOVERY') telaNovaSenha();          // veio do link "esqueci a senha"
    if (evento === 'TOKEN_REFRESHED' || evento === 'SIGNED_IN') atualizarTokenSW();
  });
  return true;
}
// aviso fixo de conexão (some sozinho quando a rede volta)
function avisoRede(on, texto = 'Sem conexão. Tentando de novo…') {
  let b = document.getElementById('aviso-rede');
  if (!on) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('div'); b.id = 'aviso-rede'; b.setAttribute('role', 'alert');
    b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:200;background:var(--perigo);color:#fff;text-align:center;padding:6px;font-size:.85rem';
    document.body.appendChild(b); }
  b.textContent = texto;
}
window.addEventListener('online', () => avisoRede(false));
window.addEventListener('offline', () => avisoRede(true));
let sessaoExpirada = false;
async function api(fn, args = {}) {
  let res;
  try { res = await sb.rpc(fn, args); }
  catch (e) { avisoRede(true); throw new Error('Failed to fetch'); }
  const { data, error, status } = res;
  if (error) {
    if (/Failed to fetch|NetworkError|fetch failed/i.test(error.message || '')) avisoRede(true); else avisoRede(false);
    // sessão vencida/inválida: volta para o login em vez de mostrar telas vazias
    if ((status === 401 || /JWT expired|invalid JWT|PGRST30/i.test(error.message + ' ' + (error.code || ''))) && !sessaoExpirada) {
      sessaoExpirada = true; toast('Sua sessão expirou. Entre de novo.', true);
      setTimeout(async () => { await sb.auth.signOut({ scope: 'local' }).catch(() => {}); location.reload(); }, 1500);
    }
    const e = new Error(error.message); e.details = error.details; e.code = error.code; throw e;
  }
  avisoRede(false);
  return data;
}
// erros inesperados das telas vão para a equipe (sem dados pessoais: só mensagem e tela)
let errosEnviados = 0;
window.addEventListener('error', (ev) => reportarErro(ev.message, { arquivo: ev.filename, linha: ev.lineno }));
window.addEventListener('unhandledrejection', (ev) => reportarErro(String(ev.reason && ev.reason.message || ev.reason), {}));
function reportarErro(msg, ctx) {
  if (!sb || errosEnviados++ > 5 || !msg) return;
  sb.rpc('registrar_erro_app', { p_app: location.pathname.split('/').pop() || 'index', p_mensagem: String(msg).slice(0, 400), p_contexto: { ...ctx, tela: location.hash } }).then(() => {}, () => {});
}
async function tabela(nome, monta) {
  let qb = sb.from(nome).select(monta.select || '*');
  if (monta.where) qb = monta.where(qb);
  const { data, error } = await qb;
  if (error) throw new Error(error.message);
  return data;
}

let toastTimer;
function toast(msg, erro = false) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.className = 'on' + (erro ? ' erro' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = ''), erro ? 5200 : 3000);
}
// executa ação de botão com trava (evita clique duplo) e mensagem de erro amigável
async function acao(botao, fn) {
  if (botao && botao.disabled) return;
  const txt = botao ? botao.innerHTML : '';
  if (botao) { botao.disabled = true; botao.innerHTML = '<span class="carregando"></span>'; }
  try { return await fn(); }
  catch (e) { console.error(e); toast(mensagemErro(e), true); }
  finally { if (botao) { botao.disabled = false; botao.innerHTML = txt; } }
}
function modal(html, aoAbrir) {
  const f = document.createElement('div'); f.className = 'modal-fundo';
  f.innerHTML = `<div class="modal" role="dialog" aria-modal="true" tabindex="-1">${html}</div>`;
  f.addEventListener('click', (ev) => { if (ev.target === f) fechar(); });

  setTimeout(() => { const alvo = f.querySelector('input,select,textarea,button') || f.querySelector('.modal'); alvo && alvo.focus(); }, 0);
  $$('[data-fechar]', f).forEach((b) => b.addEventListener('click', fechar));

// gráfico de barras/linhas em SVG (sem biblioteca)
function grafico(series, { altura = 160, tipo = 'barra', rotulos = [], formato = (v) => num(v) } = {}) {
  const vals = series.flatMap((s) => s.valores.map(Number).filter((v) => Number.isFinite(v)));
  const max = Math.max(1, ...vals), min = Math.min(0, ...vals), L = 600, A = altura, m = 22, n = Math.max(1, series[0]?.valores.length || 1);
  const y = (v) => A - m - ((v - min) / (max - min || 1)) * (A - 2 * m);
  const larg = (L - 2 * m) / n;
  let s = `<svg class="grafico" viewBox="0 0 ${L} ${A}" role="img"><line x1="${m}" x2="${L - m}" y1="${y(0)}" y2="${y(0)}" stroke="currentColor" opacity=".2"/>`;
  series.forEach((ser, k) => {
    if (tipo === 'barra') ser.valores.forEach((v, i) => {
      const bw = larg / series.length * .8, x = m + i * larg + k * bw + larg * .1, yv = y(Math.max(0, v)), h = Math.abs(y(v) - y(0));
      s += `<rect x="${x}" y="${v >= 0 ? yv : y(0)}" width="${bw}" height="${Math.max(h, .5)}" rx="2" fill="${ser.cor || 'var(--pri)'}"><title>${esc((rotulos[i] || '') + ': ' + formato(v))}</title></rect>`;
    });
    else s += `<polyline fill="none" stroke="${ser.cor || 'var(--pri)'}" stroke-width="2.5" points="${ser.valores.map((v, i) => `${m + i * larg + larg / 2},${y(v)}`).join(' ')}"/>`;
  });
  const passo = Math.ceil(n / 8);
  rotulos.forEach((r, i) => { if (i % passo === 0) s += `<text x="${m + i * larg + larg / 2}" y="${A - 6}" text-anchor="middle">${esc(r)}</text>`; });
  s += `<text x="${m}" y="12">${esc(formato(max))}</text></svg>`;
  return s;
}

    (f, fechar) => { $('#bu-ok', f).onclick = (ev) => acao(ev.currentTarget, async () => { const l = await api('admin_buscar_usuarios', { p_texto: $('#bu-t', f).value, p_limite: 20 });
      $('#bu-l', f).innerHTML = l.map((u, i) => `<li class="linha"><span class="cresce">${esc(u.nome)} <span class="sub peq">${esc(u.telefone || '')} ${esc((u.papeis || []).join(', '))}</span></span><button class="mini" data-i="${i}">Escolher</button></li>`).join('') || '<li class="sub">Nada encontrado.</li>';
      $$('[data-i]', f).forEach((b) => (b.onclick = () => { fechar(); res(l[+b.dataset.i]); })); }); }));
}

// ===================== PAINEL DO DONO =====================
let filtroDono = { per: '30d', cidade: '', categoria: '', motorista: null, passageiro: null };
async function telaDono() {
  const f = filtroDono, p = periodo(f.per);
  const d = await api('dono_dashboard', { p_inicio: p.ini, p_fim: p.fim, p_cidade: f.cidade || null, p_categoria: f.categoria || null,
    p_motorista: f.motorista ? f.motorista.id : null, p_passageiro: f.passageiro ? f.passageiro.id : null });
  const fin = d.financeiro, cor = d.corridas, s = d.serie_diaria;
  C(`<h1>Painel do dono</h1>
    <div class="card filtros"><div><label>Período</label><select id="f-per">${[['hoje', 'Hoje'], ['7d', '7 dias'], ['30d', '30 dias'], ['mes', 'Este mês']].map(([k, t]) => `<option value="${k}" ${f.per === k ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div><label>Cidade</label><select id="f-cid">${opCidades(f.cidade)}</select></div><div><label>Categoria</label><select id="f-cat">${opCats(f.categoria)}</select></div>
      <div><label>Motorista</label><button class="sec cheio" id="f-mot">${f.motorista ? esc(f.motorista.nome) : 'Todos'}</button></div>
      <div><label>Passageiro</label><button class="sec cheio" id="f-pas">${f.passageiro ? esc(f.passageiro.nome) : 'Todos'}</button></div></div>
    <div class="grade">${kpi('GMV (corridas pagas)', reais(fin.gmv))}${kpi('Receita de comissões', reais(fin.receita_comissoes))}${kpi('Pago aos motoristas', reais(fin.pago_aos_motoristas))}
      ${kpi('Bônus de indicação', reais(fin.bonus_indicacao))}${kpi('Assinaturas Mobi+', reais(fin.receita_assinaturas))}${kpi('Taxas de cancelamento', reais(fin.receita_taxas_cancelamento))}
      ${kpi('Descontos e reembolsos', reais(fin.descontos_cupons_mobi_mais + fin.reembolsos_em_creditos))}${kpi('Custos operacionais', reais(fin.custos_operacionais))}
      ${kpi('Lucro operacional', reais(d.lucro_operacional_estimado.valor), 'ESTIMATIVA')}${kpi('CAC', reais(d.cac.valor), d.cac.novos_passageiros + ' novos passageiros')}
      ${kpi('LTV', reais(d.ltv_estimado.valor), 'ESTIMATIVA · churn ' + (d.ltv_estimado.churn_mensal != null ? num(d.ltv_estimado.churn_mensal * 100, 1) + '%' : '—'))}
      ${kpi('Corridas pagas', num(cor.pagas), `${num(cor.solicitadas)} pedidas · ${num(cor.taxa_cancelamento_pct, 1)}% canceladas`)}${kpi('Ticket médio', reais(cor.ticket_medio))}</div>
    <div class="${fin.conferencia.ok ? 'info' : 'erro'}">Conferência do ledger: ${esc(fin.conferencia.regra)} — ${fin.conferencia.ok ? 'OK' : 'DIVERGENTE'}</div>
    ${d.lucro_operacional_estimado.aviso ? `<div class="aviso">${esc(d.lucro_operacional_estimado.aviso)}</div>` : ''}
    <div class="card"><h2>GMV por dia</h2>${grafico([{ valores: s.map((x) => x.gmv) }], { rotulos: s.map((x) => x.dia.slice(8, 10) + '/' + x.dia.slice(5, 7)), formato: reais })}</div>
    <div class="grade"><div class="card"><h2>Por categoria</h2><table>${d.por_categoria.map((x) => `<tr><td>${esc(x.categoria)}</td><td>${num(x.corridas)}</td><td>${reais(x.gmv)}</td></tr>`).join('')}</table></div>
      <div class="card"><h2>Por cidade</h2><table>${d.por_cidade.map((x) => `<tr><td>${esc(x.cidade)} – ${esc(x.uf)}</td><td>${num(x.corridas)}</td><td>${reais(x.gmv)}</td></tr>`).join('')}</table></div></div>
    <div class="card"><h2>Como os números são calculados</h2><p class="sub">${esc(d.lucro_operacional_estimado.composicao)}. ${esc(d.ltv_estimado.aviso)} Gateway: taxa estimada configurável (parâmetro <code>taxa_gateway_estimada_pct</code>).</p></div>`);
  const re = () => telaDono().catch((e) => toast(mensagemErro(e), true));
  $('#f-per').onchange = (e) => { f.per = e.target.value; re(); };
  $('#f-cid').onchange = (e) => { f.cidade = e.target.value; re(); };
  $('#f-cat').onchange = (e) => { f.categoria = e.target.value; re(); };
  $('#f-mot').onclick = async () => { f.motorista = f.motorista ? null : await escolherUsuario('Filtrar por motorista'); re(); };
  $('#f-pas').onclick = async () => { f.passageiro = f.passageiro ? null : await escolherUsuario('Filtrar por passageiro'); re(); };
}

// ===================== MAPA OPERACIONAL =====================
async function telaMapa(uf = null, cidade = null) {
  const d = await api('mapa_operacional', { p_uf: uf, p_cidade: cidade });
  C(`<h1>Mapa operacional</h1><div class="linha sub"><a href="#" id="nv-br">Brasil</a>${uf ? ` › <a href="#" id="nv-uf">${esc(uf)}</a>` : ''}${d.nivel === 'CIDADE' ? ` › ${esc(d.cidade.nome)}` : ''}<span class="esp cresce"></span><span class="peq">atualiza a cada 20 s</span></div>
    <div class="mapa grande" id="mapa"></div><div id="tab"></div>`);
  const centro = d.nivel === 'CIDADE' ? { lat: d.cidade.lat, lng: d.cidade.lng } : (d.itens[0] ? { lat: d.itens[0].lat, lng: d.itens[0].lng } : { lat: -15.8, lng: -47.9 });
  A.mapa = criarMapa($('#mapa'), centro, d.nivel === 'BRASIL' ? 4 : d.nivel === 'UF' ? 7 : 12); A.camadas = L.layerGroup().addTo(A.mapa);
  $('#nv-br').onclick = (e) => { e.preventDefault(); telaMapa(); };
  if ($('#nv-uf')) $('#nv-uf').onclick = (e) => { e.preventDefault(); telaMapa(uf); };
  if (d.nivel === 'CIDADE') {
    d.zonas.forEach((z) => L.circle([z.lat, z.lng], { radius: 550, color: corNivel[z.nivel], fillOpacity: .25, weight: 1 }).addTo(A.camadas).bindPopup(`<b>${esc(z.regiao)}</b><br>${esc(z.nivel)} · ${esc(z.demanda_15)} pedidos/15min · ${esc(z.disponiveis)} disponíveis`));
    d.motoristas.forEach((m) => L.circleMarker([m.lat, m.lng], { radius: 4, color: m.disponivel ? '#1f7a3a' : '#0b6bcb', fillOpacity: 1 }).addTo(A.camadas));
    d.incidentes.forEach((i) => i.lat && L.marker([i.lat, i.lng], { title: String(i.tipo) }).addTo(A.camadas).bindPopup(`🚨 ${esc(i.tipo)} · ${esc(i.gravidade)} · ${esc(i.etapa)}`));
    d.regioes.forEach((r) => L.circle([r.lat, r.lng], { radius: r.raio_km * 1000, color: '#555', fill: false, dashArray: '4 4', weight: 1 }).addTo(A.camadas).bindTooltip(esc(r.nome) + ' (' + esc(r.tipo) + ')'));
    $('#tab').innerHTML = `<div class="grade" style="margin-top:10px">${kpi('Motoristas online', num(d.motoristas.length))}${kpi('Disponíveis', num(d.motoristas.filter((m) => m.disponivel).length))}${kpi('Incidentes abertos', num(d.incidentes.length))}${kpi('Eventos (24 h)', num(d.eventos.length))}</div>
      <div class="card rolar"><table><tr><th>Região</th><th>Nível</th><th>Pedidos 15 min</th><th>Tendência</th><th>Disponíveis</th><th>Em andamento</th></tr>${d.zonas.sort((a, b) => b.pressao - a.pressao).slice(0, 25).map((z) => `<tr><td>${esc(z.regiao)}</td><td><span class="pilula ${esc(z.nivel)}">${esc(z.nivel)}</span></td><td>${num(z.demanda_15)}</td><td>${num(z.tendencia_pct)}%</td><td>${num(z.disponiveis)}</td><td>${num(z.em_andamento)}</td></tr>`).join('')}</table></div>`;
  } else {
    d.itens.forEach((it) => L.circleMarker([it.lat, it.lng], { radius: 10 + Math.min(20, it.pedidos_15min), color: corNivel[it.nivel], fillOpacity: .5 }).addTo(A.camadas)
      .bindTooltip(`${esc(it.nome)}: ${esc(it.pedidos_15min)} pedidos/15 min`).on('click', () => (d.nivel === 'BRASIL' ? telaMapa(it.chave) : telaMapa(uf, it.chave))));
    $('#tab').innerHTML = `<div class="card rolar"><table><tr><th>${d.nivel === 'BRASIL' ? 'UF' : 'Cidade'}</th><th>Nível</th><th>Online</th><th>Disponíveis</th><th>Em andamento</th><th>Pedidos 15 min</th><th>Sem motorista 1 h</th><th>Incidentes</th><th></th></tr>
      ${d.itens.map((it) => `<tr><td>${esc(it.nome)}</td><td><span class="pilula ${esc(it.nivel)}">${esc(it.nivel)}</span></td><td>${num(it.motoristas_online)}</td><td>${num(it.motoristas_disponiveis)}</td><td>${num(it.corridas_em_andamento)}</td><td>${num(it.pedidos_15min)}</td><td>${num(it.sem_motorista_1h)}</td><td>${num(it.incidentes_abertos)}</td><td><button class="mini sec" data-ir="${esc(it.chave)}">Abrir</button></td></tr>`).join('')}</table></div>`;
    $$('[data-ir]').forEach((b) => (b.onclick = () => (d.nivel === 'BRASIL' ? telaMapa(b.dataset.ir) : telaMapa(uf, b.dataset.ir))));
  }
  clearInterval(A.poll); A.poll = setInterval(() => { if (location.hash === '#mapa') telaMapa(uf, cidade).catch(() => {}); else clearInterval(A.poll); }, 20000);
}

    api('analytics_funil', { p_inicio: p.ini, p_fim: p.fim }), api('admin_indicacao_metricas', { p_inicio: p.ini, p_fim: p.fim }).catch(() => null)]);
  const tabCoorte = (c) => `<div class="rolar"><table class="calor"><tr><th>Coorte</th><th>Tamanho</th>${[0, 1, 2, 3, 4, 5].map((k) => `<th>M${k}</th>`).join('')}</tr>

      <p class="sub">Cancelamentos — passageiro ${num(fu.canceladas.passageiro)}, motorista ${num(fu.canceladas.motorista)}, sistema ${num(fu.canceladas.sistema)} · sem motorista ${num(fu.sem_motorista)}</p>
      <h3>Motivos de cancelamento</h3><ul class="lista">${fu.motivos_cancelamento.map((m) => `<li>${esc(m.motivo)} — ${num(m.n)}</li>`).join('') || '<li class="sub">—</li>'}</ul></div>
    <div class="card"><h2>Retenção de passageiros</h2>${tabCoorte(cp)}</div><div class="card"><h2>Retenção de motoristas</h2>${tabCoorte(cm)}</div>
    ${ind ? `<div class="card"><h2>Indicação</h2><pre>${esc(JSON.stringify(ind, null, 2))}</pre></div>` : ''}`);
}

// ===================== ASSISTENTE DO ADMIN =====================
async function telaAssistente() {
  const P = ['Quantas corridas tivemos hoje?', 'Qual foi a receita da semana?', 'Quanto pagamos aos motoristas este mês?', 'Qual cidade mais cresceu?', 'Qual cidade tem mais cancelamentos?',
    'Qual o horário de pico?', 'Onde falta motorista agora?', 'Quantos casos de fraude temos abertos?'];
  C(`<h1>Assistente</h1><p class="sub">Responde com os dados reais do banco. Se faltar dado, diz que falta.</p><div class="filtros card"><div><label>Cidade (opcional)</label><select id="as-cid">${opCidades('', true)}</select></div></div>
    <div class="chat" id="chat">${A.conversa.map((x) => `<div class="bolha ${x.eu ? 'eu' : 'ia'}">${esc(x.t)}</div>`).join('')}</div><div class="chips">${P.map((p) => `<button data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div>
    <div class="linha"><input id="pergunta" class="cresce" maxlength="300"><button id="enviar">Perguntar</button></div>`);
  const perguntar = async (t) => {
    if (!t.trim()) return; A.conversa.push({ eu: true, t }); $('#chat').insertAdjacentHTML('beforeend', `<div class="bolha eu">${esc(t)}</div>`);
    let r; try { r = await api('assistente_admin', { p_pergunta: t, p_cidade: $('#as-cid').value || null }); } catch (e) { r = { resposta: mensagemErro(e) }; }
    A.conversa.push({ eu: false, t: r.resposta }); $('#chat').insertAdjacentHTML('beforeend', `<div class="bolha ia">${esc(r.resposta)}</div>`); $('#pergunta').value = '';
  };
  $$('[data-p]').forEach((b) => (b.onclick = () => perguntar(b.dataset.p)));
  $('#enviar').onclick = () => perguntar($('#pergunta').value);
}

// ===================== CENTRAL DE SEGURANÇA =====================
const TIPOS_ACAO = ['NOTA', 'LIGOU_PASSAGEIRO', 'LIGOU_MOTORISTA', 'LIGOU_CONTATO', 'MENSAGEM', 'ACIONOU_190', 'ACIONOU_192', 'ESCALONOU', 'SUSPENDEU_CONTA'];

async function telaSeguranca(ativos = true) {
  const p = await api('seguranca_painel', { p_ativos: ativos, p_limite: 100 });
  const r = p.resumo;
  C(`<h1>Central de segurança</h1><p class="sub">Fluxo: detecção → análise → contato → intervenção → encerramento → registro. O sistema não presume crime: confirme com as pessoas antes de agir.</p>
    <div class="grade">${kpi('Ativos', num(r.ativos))}${kpi('Críticos', num(r.criticos))}${kpi('Sem responsável', num(r.sem_responsavel))}${kpi('Encerrados 24 h', num(r.encerrados_24h))}${kpi('Tempo médio p/ assumir', num(r.tempo_medio_assumir_min, 1) + ' min')}</div>
    <div class="chips"><button id="sg-ativos" ${ativos ? 'style="border-color:var(--pri)"' : ''}>Ativos</button><button id="sg-enc" ${!ativos ? 'style="border-color:var(--pri)"' : ''}>Encerrados</button></div>

}
function abrirIncidente(i, ativos) {
  const pes = (x, t) => x ? `<div><b>${t}:</b> ${esc(x.nome)} · <a href="tel:${esc(x.telefone)}">${esc(x.telefone)}</a>${x.veiculo ? ` · ${esc(x.veiculo.modelo)} ${esc(x.veiculo.cor)} ${esc(x.veiculo.placa)}` : ''}
      ${x.contatos_confianca ? `<div class="sub peq">Contatos de confiança: ${x.contatos_confianca.map((c) => esc(c.nome) + ' ' + esc(c.telefone)).join(', ')}</div>` : ''}</div>` : '';
  modal(`<h2>${esc(i.tipo)} <span class="pilula ${esc(i.gravidade)}">${esc(i.gravidade)}</span></h2><div class="sub">${esc(i.descricao || '')} · aberto ${dataHora(i.criado_em)} · etapa ${esc(i.etapa)} · status ${esc(i.status)}</div>
    ${pes(i.passageiro, 'Passageiro')}${pes(i.motorista, 'Motorista')}
    ${i.corrida ? `<div class="sub">Corrida ${esc(i.corrida.status)} · ${esc(i.corrida.origem)} → ${esc(i.corrida.destino)}</div>` : ''}
    <div class="mapa baixo" id="inc-mapa" style="margin:8px 0"></div>
    <h3>Verificações automáticas</h3><ul class="lista">${i.verificacoes.map((v) => `<li>${esc(v.tipo)} · ${esc(v.status)} <span class="sub peq">${dataHora(v.criada_em)}</span></li>`).join('') || '<li class="sub">—</li>'}</ul>
    <h3>Linha do tempo</h3><ul class="timeline">${i.historico.map((h) => `<li><b>${esc(h.tipo)}</b> (${esc(h.etapa)}) — ${esc(h.descricao || '')}<div class="sub peq">${esc(h.quem || '')} · ${dataHora(h.quando)}</div></li>`).join('') || '<li class="sub">Sem ações.</li>'}</ul>
    ${ativos ? `<p></p>${!i.responsavel ? '<button class="cheio" id="inc-assumir">Assumir incidente</button>' : `
      <div class="card"><label>Registrar ação</label><select id="inc-tipo">${TIPOS_ACAO.map((t) => `<option>${t}</option>`).join('')}</select><textarea id="inc-desc" rows="2" placeholder="O que foi feito / dito"></textarea><p></p><button class="cheio" id="inc-acao">Registrar</button></div>
      <div class="card"><label>Encerrar com desfecho</label><select id="inc-desf">${DESFECHOS.map((t) => `<option>${t}</option>`).join('')}</select><textarea id="inc-res" rows="2" placeholder="Resumo do encerramento"></textarea><p></p><button class="sec cheio" id="inc-enc">Encerrar</button></div>`}` : `<div class="info">Desfecho: ${esc(i.desfecho)} — ${esc(i.resolucao || '')}</div>`}
    <button class="sec cheio" data-fechar>Fechar</button>`, (f, fechar) => {
    const ponto = i.lat ? [i.lat, i.lng] : i.corrida && i.corrida.posicao_motorista && i.corrida.posicao_motorista.lat ? [i.corrida.posicao_motorista.lat, i.corrida.posicao_motorista.lng] : null;
    if (ponto) { const m = criarMapa($('#inc-mapa', f), { lat: ponto[0], lng: ponto[1] }, 14); L.marker(ponto).addTo(m); if (i.trilha.length) L.polyline(i.trilha, { color: '#c62828' }).addTo(m); } else $('#inc-mapa', f).remove();
    const b = (s, fn) => { const el = $(s, f); if (el) el.onclick = (ev) => acao(ev.currentTarget, fn); };
    b('#inc-assumir', async () => { await api('seguranca_assumir', { p_incidente: i.id }); fechar(); telaSeguranca(); });
    b('#inc-acao', async () => { await api('seguranca_registrar_acao', { p_incidente: i.id, p_tipo: $('#inc-tipo', f).value, p_descricao: $('#inc-desc', f).value }); fechar(); telaSeguranca(); });
    b('#inc-enc', async () => { await api('seguranca_encerrar', { p_incidente: i.id, p_desfecho: $('#inc-desf', f).value, p_resolucao: $('#inc-res', f).value }); fechar(); telaSeguranca(); });
  });
}

async function telaMotoristas() {
  const [docs, veics, mots] = await Promise.all([
    tabela('documentos', { select: 'id,tipo,status,validade,arquivo_path,dono_tipo,dono_id,motorista_id,criado_em', where: (q) => q.in('status', ['ENVIADO', 'EM_ANALISE']).order('criado_em').limit(100) }),
    tabela('veiculos', { select: 'id,motorista_id,marca,modelo,ano,placa,cor,capacidade,acessivel,status,categorias_pedidas,itens_declarados,itens_verificados', where: (q) => q.order('criado_em', { ascending: false }).limit(200) }),
    tabela('motoristas', { select: 'id,status,cnh_categoria,cnh_validade,avaliacao_media,total_corridas,treinamentos,motivo_status', where: (q) => q.order('criado_em', { ascending: false }).limit(200) })]);
  const nomes = Object.fromEntries((await tabela('perfis', { select: 'id,nome', where: (q) => q.in('id', [...new Set(mots.map((m) => m.id).concat(docs.map((d) => d.motorista_id)))].slice(0, 300)) }).catch(() => [])).map((p) => [p.id, p.nome]));

  const itensPend = veics.filter((v) => (v.itens_declarados || []).some((i) => !(v.itens_verificados || []).includes(i)));
  C(`<h1>Motoristas e documentos</h1>
    <div class="card rolar"><h2>Documentos para analisar (${docs.length})</h2><table><tr><th>Motorista</th><th>Documento</th><th>Validade</th><th>Enviado</th><th></th></tr>
      ${docs.map((d) => `<tr><td>${esc(nomes[d.motorista_id] || d.motorista_id)}</td><td>${esc(d.tipo)} <span class="sub peq">${esc(d.dono_tipo)}</span></td><td>${dataCurta(d.validade)}</td><td>${dataHora(d.criado_em)}</td>
        <td><button class="mini sec" data-ver="${esc(d.arquivo_path)}">Ver</button> <button class="mini ok" data-doc="${d.id}" data-ok="1">Aprovar</button> <button class="mini perigo" data-doc="${d.id}" data-ok="0">Reprovar</button></td></tr>`).join('') || '<tr><td colspan="5" class="sub">Fila vazia.</td></tr>'}</table></div>
    <div class="card rolar"><h2>Veículos para analisar (${pendVeic.length})</h2><table><tr><th>Motorista</th><th>Veículo</th><th>Pedidas</th><th>Liberar categorias</th><th></th></tr>
      ${pendVeic.map((v) => `<tr><td>${esc(nomes[v.motorista_id] || '')}</td><td>${esc(v.marca)} ${esc(v.modelo)} ${esc(v.ano)} · ${esc(v.placa)} · ${esc(v.capacidade)} lug.${v.acessivel ? ' · acessível' : ''}</td><td>${esc((v.categorias_pedidas || []).join(', '))}</td>
        <td><input data-cats="${v.id}" value="${esc((v.categorias_pedidas || []).join(','))}"></td><td><button class="mini ok" data-veic="${v.id}" data-ok="1">Aprovar</button> <button class="mini perigo" data-veic="${v.id}" data-ok="0">Reprovar</button></td></tr>`).join('') || '<tr><td colspan="5" class="sub">Nenhum.</td></tr>'}</table></div>
    <div class="card rolar"><h2>Itens declarados a conferir (${itensPend.length})</h2><table>${itensPend.map((v) => `<tr><td>${esc(nomes[v.motorista_id] || '')} · ${esc(v.placa)}</td><td>declarados: ${esc(v.itens_declarados.join(', '))}<br><span class="sub">verificados: ${esc((v.itens_verificados || []).join(', ') || '—')}</span></td>
      <td><button class="mini" data-itens="${v.id}" data-lista="${esc(v.itens_declarados.join(','))}">Confirmar todos</button></td></tr>`).join('') || '<tr><td class="sub">Nada a conferir.</td></tr>'}</table></div>
    <div class="card rolar"><h2>Motoristas</h2><table><tr><th>Nome</th><th>Status</th><th>Nota</th><th>Corridas</th><th>CNH</th><th>Treinamentos</th><th></th></tr>
      ${mots.map((m) => `<tr><td>${esc(nomes[m.id] || m.id)}</td><td><span class="pilula ${esc(m.status)}">${esc(m.status)}</span>${m.motivo_status ? `<div class="sub peq">${esc(m.motivo_status)}</div>` : ''}</td><td>${num(m.avaliacao_media, 2)}</td><td>${num(m.total_corridas)}</td>
        <td>${esc(m.cnh_categoria || '')} ${dataCurta(m.cnh_validade)}</td><td class="peq">${esc((m.treinamentos || []).join(', '))}</td>
        <td><select data-mst="${m.id}"><option value="">Alterar status…</option>${['ATIVO', 'SUSPENSO', 'BLOQUEADO', 'INATIVO', 'EM_ANALISE'].map((s) => `<option>${s}</option>`).join('')}</select>
          <select data-trein="${m.id}"><option value="">Treinamento…</option>${['ACESSIBILIDADE', 'TRANSPORTE_INFANTIL', 'DIRECAO_DEFENSIVA', 'ATENDIMENTO_EXECUTIVO'].map((s) => `<option>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`);
  $$('[data-ver]').forEach((b) => (b.onclick = (ev) => acao(ev.currentTarget, async () => { const { data, error } = await sb.storage.from('documentos').createSignedUrl(b.dataset.ver, 120); if (error) throw new Error(error.message); window.open(data.signedUrl, '_blank', 'noopener'); })));

  $$('[data-itens]').forEach((b) => (b.onclick = (ev) => acao(ev.currentTarget, async () => { await api('ops_verificar_itens_veiculo', { p_veiculo: b.dataset.itens, p_itens: b.dataset.lista.split(',') }); telaMotoristas(); })));
  $$('[data-mst]').forEach((s) => (s.onchange = () => acao(null, async () => { if (!s.value) return; const motivo = prompt('Motivo (fica registrado e o motorista vê):'); if (!motivo) { s.value = ''; return; }
    await api('ops_alterar_status_motorista', { p_motorista: s.dataset.mst, p_status: s.value, p_motivo: motivo }); telaMotoristas(); })));
  $$('[data-trein]').forEach((s) => (s.onchange = () => acao(null, async () => { if (!s.value) return; await api('ops_definir_treinamento', { p_motorista: s.dataset.trein, p_treinamento: s.value, p_ativo: true }); toast('Treinamento registrado.'); telaMotoristas(); })));
}

async function telaRisco(nivel = null) {
  const [p, sinais, retidos] = await Promise.all([api('risco_painel', { p_nivel: nivel, p_limite: 100 }),

  C(`<h1>Análise de risco</h1><div class="aviso">A pontuação é apoio à análise. Ela nunca bloqueia ninguém sozinha: bloquear exige evidência confirmada ou justificativa detalhada, e tudo fica registrado.</div>

      ${p.fila.map((x) => `<tr><td>${esc(x.nome)} ${x.motorista ? '<span class="pilula">motorista</span>' : ''}<div class="sub peq">${esc(x.status_conta)}</div></td><td><span class="pilula ${esc(x.nivel)}">${esc(x.nivel)}</span></td><td>${num(x.score)}</td>
        <td class="peq">${x.fatores.map((f) => esc(f.fator) + ' (+' + f.pontos + ')').join('<br>')}</td><td class="peq">${x.ultima_analise ? esc(x.ultima_analise.acao) + ' · ' + dataCurta(x.ultima_analise.quando) : '—'}</td>

    <div class="card rolar"><h2>Sinais em aberto</h2><table><tr><th>Sev.</th><th>Tipo</th><th>Entidade</th><th>Quando</th><th></th></tr>
      ${sinais.map((s) => `<tr><td>${esc(s.severidade)}</td><td>${esc(s.tipo)}<div class="sub peq">${esc(JSON.stringify(s.detalhes || {}).slice(0, 120))}</div></td><td class="peq">${esc(s.entidade_tipo)} ${esc(String(s.entidade_id).slice(0, 8))}</td><td>${dataHora(s.criado_em)}</td>

    <div class="card rolar"><h2>Bônus de indicação retidos</h2><table>${retidos.map((g) => `<tr><td>${reais(g.valor)} · nível ${esc(g.nivel)}</td><td class="peq">${esc(g.motivo || '')}</td><td><button class="mini ok" data-g="${g.id}" data-l="1">Liberar</button> <button class="mini perigo" data-g="${g.id}" data-l="0">Negar</button></td></tr>`).join('') || '<tr><td class="sub">Nenhum.</td></tr>'}</table></div>`);
  $$('[data-n]').forEach((b) => (b.onclick = () => telaRisco(b.dataset.n || null)));

      <label>Ação</label><select id="ds-acao">${['NENHUMA', 'NEGAR_BONUS', 'SUSPENDER_MOTORISTA', 'BLOQUEAR_USUARIO'].map((a) => `<option>${a}</option>`).join('')}</select><label>Observação</label><textarea id="ds-obs" rows="3"></textarea><p></p>

      await api('risco_decidir_sinal', { p_sinal: b.dataset.s, p_confirmar: $('#ds-conf', f).checked, p_acao: $('#ds-acao', f).value, p_observacao: $('#ds-obs', f).value }); fechar(); telaRisco(nivel); })))));

      <label>Regras da cidade (JSON: dinheiro, pesos, liberação…)</label><textarea id="ci-regras" rows="3">${esc(JSON.stringify(det.regras || {}))}</textarea>
      <label>Requisitos (JSON: documentos, EAR, idade do veículo)</label><textarea id="ci-req" rows="3">${esc(JSON.stringify(det.requisitos || {}))}</textarea>
      <label>Regulamentação municipal (texto para revisão jurídica)</label><textarea id="ci-reg" rows="2">${esc(det.regulamentacao || '')}</textarea><p></p><button id="ci-ok">Salvar cidade</button></div>

    <div class="card rolar"><table><tr><th>Pessoa</th><th>Papel</th><th>Cidade</th><th></th></tr>${staff.map((s) => `<tr><td>${esc(nomes[s.usuario_id] || s.usuario_id)}</td><td>${esc(s.papel)}</td><td>${esc((A.cidades.find((c) => c.id === s.cidade_id) || {}).nome || 'todas')}</td>
      <td><button class="mini sec" data-rev="${s.usuario_id}" data-p="${esc(s.papel)}">Revogar</button></td></tr>`).join('')}</table></div>
    <div class="card"><h2>O que cada papel faz</h2><ul class="sub"><li><b>SUPER_ADMIN</b>: tudo, inclusive conceder ADMIN e mudar o ambiente.</li><li><b>ADMIN</b>: configuração, cidades, tarifas, equipe (exceto ADMIN).</li>
      <li><b>FINANCEIRO</b>: painel do dono, estornos, reembolsos, empresas, cupons, custos.</li><li><b>OPERACOES</b>: mapa, inteligência, motoristas, documentos, parceiros, campanhas.</li>
      <li><b>RISCO</b>: fila de risco, sinais, CPF completo (com justificativa registrada).</li><li><b>SUPORTE</b>: central de segurança e atendimento.</li></ul></div>`);
  $('#eq-add').onclick = async () => { const u = await escolherUsuario('Conceder papel a…'); if (!u) return;
    modal(`<h2>${esc(u.nome)}</h2><label>Papel</label><select id="pp">${['SUPORTE', 'OPERACOES', 'FINANCEIRO', 'RISCO', 'ADMIN', 'SUPER_ADMIN'].map((p) => `<option>${p}</option>`).join('')}</select><label>Restringir à cidade (opcional)</label><select id="pc">${opCidades('', true)}</select><p></p><button class="cheio" id="pok">Conceder</button>`,
      (f, fechar) => ($('#pok', f).onclick = (ev) => acao(ev.currentTarget, async () => { await api('admin_definir_papel', { p_usuario: u.id, p_papel: $('#pp', f).value, p_ativo: true, p_cidade: $('#pc', f).value || null }); fechar(); telaEquipe(); }))); };
  $$('[data-rev]').forEach((b) => (b.onclick = (ev) => acao(ev.currentTarget, async () => { if (await confirmar('Revogar ' + b.dataset.p + '?', 'Revogar', true)) { await api('admin_definir_papel', { p_usuario: b.dataset.rev, p_papel: b.dataset.p, p_ativo: false }); telaEquipe(); } })));
}
async function telaConfig() {
  const cfgs = await tabela('configuracoes', { select: 'chave,valor,descricao', where: (q) => q.order('chave') });
  C(`<h1>Parâmetros</h1><div class="aviso">Mudanças valem na hora e ficam na auditoria. "ambiente" só o SUPER ADMIN altera.</div>
    <div class="card rolar"><table><tr><th>Chave</th><th>Valor (JSON)</th><th></th></tr>${cfgs.map((c) => `<tr><td><b>${esc(c.chave)}</b><div class="sub peq">${esc(c.descricao || '')}</div></td>
      <td><textarea data-cfg="${esc(c.chave)}" rows="${String(JSON.stringify(c.valor)).length > 60 ? 3 : 1}">${esc(JSON.stringify(c.valor))}</textarea></td><td><button class="mini" data-salvar="${esc(c.chave)}">Salvar</button></td></tr>`).join('')}</table></div>`);
  $$('[data-salvar]').forEach((b) => (b.onclick = (ev) => acao(ev.currentTarget, async () => { let v; try { v = JSON.parse($(`[data-cfg="${b.dataset.salvar}"]`).value); } catch (e) { throw new Error('JSON inválido.'); }
    await api('admin_salvar_config', { p_chave: b.dataset.salvar, p_valor: v }); toast('Salvo.'); })));
}
async function telaSaude() {
  const [s, jobs, wh] = await Promise.all([api('saude_sistema'), tabela('jobs_execucoes', { select: '*', where: (q) => q.order('inicio', { ascending: false }).limit(30) }),
    tabela('webhook_tentativas', { select: '*', where: (q) => q.order('recebido_em', { ascending: false }).limit(30) }).catch(() => [])]);
  C(`<h1>Saúde do sistema</h1><div class="sub">Verificado ${dataHora(s.verificado_em)}</div>
    <div class="grade">${s.itens.map((i) => `<div class="kpi"><div class="r">${esc(i.item)}</div><div class="v" style="font-size:1.05rem">${esc(i.valor)}</div><span class="pilula ${esc(i.nivel)}">${esc(i.nivel)}</span></div>`).join('')}</div>
    <div class="card rolar"><h2>Últimas execuções de jobs</h2><table><tr><th>Job</th><th>Início</th><th>Duração</th><th>OK</th><th>Erro</th></tr>${jobs.map((j) => `<tr><td>${esc(j.job)}</td><td>${dataHora(j.inicio)}</td><td>${num(j.duracao_ms)} ms</td><td>${j.ok ? '✔' : '✘'}</td><td class="peq">${esc(j.erro || '')}</td></tr>`).join('')}</table></div>
    ${wh.length ? `<div class="card rolar"><h2>Webhooks recebidos</h2><table><tr><th>Quando</th><th>Gateway</th><th>Evento</th><th>Assinatura</th><th>Status</th><th>Erro</th></tr>${wh.map((w) => `<tr><td>${dataHora(w.recebido_em)}</td><td>${esc(w.gateway)}</td><td class="peq">${esc(w.evento_id || '')}</td><td>${w.assinatura_valida ? '✔' : '✘'}</td><td>${esc(w.status_resposta)}</td><td class="peq">${esc(w.erro || '')}</td></tr>`).join('')}</table></div>` : ''}`);
  clearInterval(A.poll); A.poll = setInterval(() => { if (location.hash === '#saude') telaSaude().catch(() => {}); }, 30000);
}
iniciar().catch((e) => { raiz.innerHTML = `<div class="app"><div class="erro">${esc(mensagemErro(e))}</div></div>`; });
</script>
</body>
</html>
